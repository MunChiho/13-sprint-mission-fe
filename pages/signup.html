<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <main class="account">
      <a href="../index.html">
        <img
          class="account-logo"
          src="/assets/logo/logo-panda-market.svg"
          alt="판다마켓"
        />
      </a>
      <div class="account-container">
        <form class="account-container-inner">
          <label for="email" class="account-label text-2lg-bold">이메일</label>
          <input
            id="email"
            class="account-input text-lg-regular"
            type="email"
            placeholder="이메일을 입력해주세요"
          />

          <div class="account-container-inner">
            <label for="username" class="account-label text-2lg-bold"
              >닉네임</label
            >
            <input
              id="username"
              class="account-input text-lg-regular"
              type="text"
              placeholder="닉네임을 입력해주세요"
            />
          </div>
          <div class="account-container-inner">
            <label for="password" class="account-label text-2lg-bold"
              >비밀번호</label
            >
            <div class="account-input-inner">
              <input
                id="password"
                class="account-input text-lg-regular"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <img
                class="account-input-icon"
                src="../assets/icon/ic-visibility_off.svg"
                ㅍ
                alt="비밀번호 눈 아이콘"
              />
            </div>
          </div>
          <div class="account-container-inner">
            <label for="confirmPassword" class="account-label text-2lg-bold"
              >비밀번호 확인</label
            >
            <div class="account-input-inner">
              <input
                id="confirmPassword"
                class="account-input text-lg-regular"
                type="password"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
              />
              <img
                class="account-input-icon"
                src="../assets/icon/ic-visibility_off.svg"
                alt="비밀번호 눈 아이콘"
              />
            </div>
          </div>
          <button class="account-btn text-xl-semibold" type="submit">
            회원가입
          </button>
        </form>
        <div class="account-social">
          <span class="account-social-title text-lg-medium"
            >간편 로그인하기</span
          >
          <div class="account-social-icon">
            <a
              class="account-social-link"
              href="https://www.google.com/"
              target="_blank"
              ><img src="../assets/icon/ic-social-google.svg"
            /></a>
            <a
              class="account-social-link"
              href="https://www.kakaocorp.com/page/"
              target="_blank"
              ><img src="../assets/icon/ic-social-kakao.svg"
            /></a>
          </div>
        </div>
        <div class="account-info">
          <span class="account-info-title text-md-medium"
            >이미 회원이신가요?</span
          >
          <a href="./login.html" class="account-info-textbtn">로그인</a>
        </div>
      </div>
    </main>
  </body>
</html>
