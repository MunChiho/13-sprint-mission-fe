    <meta charset="UTF-8" />

    <link rel="stylesheet" href="./style/reset.css" />

    <title>판다마켓-Login</title>

  <body>
    <!-- Google Tag Manager (noscript) -->

    <main>
      <section class="section">
        <div class="logo-box">
          <a href="./main.html">
            <img src="./img/login/logo.png" alt="판다마켓 로고" />
          </a>
        </div>

        <div class="main-box">
          <div class="type-box">
            <label for="id">이메일</label> <br />
            <input
              type="text"
              placeholder="이메일을 입력해주세요"
              id="id"
              class="input"
            />
            <br />
            <label for="password">비밀번호</label> <br />

            <div class="input-pw">
              <input
                type="password"
                placeholder="비밀번호를 입력해주세요"
                id="password"
              />
              <img
                src="./img/login/btn_eye.svg"
                alt="비밀번호 보호 이미지"
                class="eyes"
              />
            </div>
          </div>
          <!-- 버튼 -->
          <div>
            <a href="./login.html"><button>로그인</button></a>
          </div>

          <div class="easy-log">
            <div class="easy-box">
              <span>간편 로그인하기</span>
              <div class="sns-icons">
                <a href="https://www.google.com/#mmc=1">
                  <img src="./img/login/구글-아이콘.png" alt="구글" />
                </a>
                <a href="https://www.kakaocorp.com/page/">
                  <img src="./img/login/카카오-아이콘.png" alt="카카오" />
                </a>
              </div>
            </div>
          </div>

          <div class="last-box">
            <p>
              판다마켓이 처음이신가요?
              <a href="./sign.up.html">회원가입</a>
            </p>
          </div>
        </div>
      </section>
    </main>
