<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <a class="logo" href="/">
          <img src="./logo/Property 1=lg.png" alt="판다마켓 로고" />
        </a>
        <a href="./login.html"><button class="login-btn">로그인</button></a>
      </div>
    </nav>
    <!-- 섹션 1 : 텍스트+버튼 / 이미자-->
    <div class="section-inner-blue">
      <!-- <div class="section-container-hero"> -->
      <div class="frame-large-top">
        <div class="text-wrap">
          <p class="section-title">일상의 모든 물건을<br />거래해 보세요</p>
          <a href="./items.html"
            ><button class="cta-btn">구경하러 가기</button></a
          >
        </div>
        <img class="img-top" src="./image/Img_home_top.png" alt="메인 이미지" />
      </div>
      <!-- </div> -->
    </div>

    <!-- 섹션 2 : 이미지 왼쪽, 텍스트 오른쪽 -->
    <div class="section-inner">
      <div class="section-container">
        <img src="./image/Img_home_01.png" alt="섹션2 이미지" />
        <div class="text-wrap">
          <span class="tag">Hot item</span>
          <p class="section-title">인기 상품을<br />확인해 보세요</p>
          <p class="section-desc">
            가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
    </div>

    <!-- 섹션 3 : 텍스트 왼쪽, 이미지 오른쪽 -->
    <div class="section-inner">
      <div class="section-container">
        <div class="text-wrap-middle">
          <span class="tag">Search</span>
          <p class="section-title-middle">
            구매를 원하는<br />상품을 검색하세요
          </p>
          <p class="section-desc-middle">
            구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
          </p>
        </div>
        <img src="./image/Img_home_02.png" alt="섹션3 이미지" />
      </div>
    </div>

    <!-- 섹션 4 : 이미지 왼쪽, 텍스트 오른쪽 -->
    <div class="section-inner">
      <div class="section-container">
        <img src="./image/Img_home_03.png" alt="섹션4 이미지" />
        <div class="text-wrap">
          <span class="tag">Register</span>
          <p class="section-title">판매를 원하는<br />상품을 등록하세요</p>
          <p class="section-desc">
            어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
          </p>
        </div>
      </div>
    </div>

    <!-- 섹션 5 : 텍스트 왼쪽, 이미지 오른쪽 (이미지 하단 붙임) -->
    <div class="section-inner-blue-bottom">
      <div class="section-container-bottom">
        <div class="text-wrap">
          <p class="section-title">믿을 수 있는<br />판다마켓 중고 거래</p>
        </div>
        <img
          class="img-bottom"
          src="./image/Img_home_bottom.png"
          alt="섹션5 이미지"
        />
      </div>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="footer-inner">
        <span class="footer-copy">©codeit - 2024</span>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="faq.html">FAQ</a>
        </div>
        <div class="footer-sns">
          <a href="https://www.facebook.com" target="_blank">
            <img src="./icons/ic_facebook.svg" alt="facebook" />
          </a>
          <a href="https://www.twitter.com" target="_blank">
            <img src="./icons/ic_twitter.svg" alt="twitter" />
          </a>
          <a href="https://www.youtube.com" target="_blank">
            <img src="./icons/ic_youtube.png" alt="youtube" />
          </a>
          <a href="https://www.instagram.com" target="_blank">
            <img src="./icons/ic_instagram.png" alt="instagram" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
