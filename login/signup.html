<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>회원가입</title>
  </head>
  <body class="signupbody">
    <div class="signup-page">
      <div class="logo-frame">
        <a href="../index.html" class="link">
          <img src="../img/pandaface2.png" alt="판다얼굴" class="pandaface" />
          <span class="pandamarket">판다마켓</span>
        </a>
      </div>
      <div class="signup-page2">
        <div class="signup-page2-1">
          <div class="signup-page2-1-1">
            <div class="oneframe">
              <label class="write" for="email">이메일</label>
              <input
                name="email"
                placeholder="이메일을 입력해주세요"
                type="email"
                id="email"
              />
            </div>
            <div class="oneframe">
              <label class="write" for="username">닉네임</label>
              <input
                name="username"
                placeholder="닉네임을 입력해주세요"
                type="text"
                id="username"
              />
            </div>
            <div class="oneframe">
              <label class="write" for="password">비밀번호</label>
                <input
                name="password"
                placeholder="비밀번호를 입력해주세요"
                type="password"
                id="password"
              />
                <img src="../img/btn_visibility.png" class="visibility" />

            </div>
            <div class="oneframe">
              <label class="write" for="password2">비밀번호 확인</label>
              <input
                name="password"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
                type="password"
                id="password2"
              />
              <img src="../img/btn_visibility.png" class="visibility" />
            </div>
          </div>
          <button><span class="login">회원가입</span></button>
        </div>
        <div class="signup-page2-2">
          <div class="signup-page2-2-1">
            <span class="quicklogin">간편로그인하기</span>
            <div class="signup-page2-2-2">
              <a href="https://www.google.com/" /><img
                src="../img/google.png"
              /></a>
              <a href="https://www.kakaocorp.com/page/"><img src="../img/kakaotalk.png" /></a>
            </div>
          </div>
        </div>
        <div class="signup-page2-3">
          <span class="footword">이미 회원이신가요?</span>
          <a class="signup" href="./login.html">로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
