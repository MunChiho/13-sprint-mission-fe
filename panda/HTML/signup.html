<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 회원가입</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="icon" href="../logo/favicon.ico" />
    <link rel="stylesheet" href="../CSS/signup.css" />
    <link rel="stylesheet" href="../CSS/reset.css" />
  </head>
  <body>
    <!-- 메인회원가입프레임 -->
    <section class="mainframe">
      <!-- 판다마켓로고프레임 -->
      <div class="pandalogo">
        <a href="./index.html">
          <img src="../img/판다마켓로그인로고.png" alt="판다마켓로고이미지" />
        </a>

        <span class="logo-font">판다마켓</span>
      </div>

      <!-- 회원가입가입프레임 -->
      <div class="membership-information">
        <div class="information">
          <!-- 이메일 박스 -->
          <div class="box">
            <span class="font">이메일</span>
            <input type="email" placeholder="이메일을 입력해주세요." />
          </div>
          <!-- 닉네임박스 -->
          <div class="box1">
            <span class="font">닉네임</span>
            <input type="text" placeholder="닉네임을 입력해주세요." />
          </div>
          <!-- 비밀번호 박스 -->
          <div class="box1">
            <span class="font">비밀번호</span>
            <input
              type="password"
              id="user-password"
              placeholder="비밀번호를 입력해주세요."
            />
            <button
              type="button"
              id="toggle-password"
              onclick="togglePassword()"
            >
              <img
                src="../img/비밀번호보기아이콘.png"
                alt="비밀번호보기아이콘"
              />
            </button>
          </div>

          <!-- 비밀번호 박스 -->
          <div class="box1">
            <span class="font">비밀번호 확인</span>
            <input
              type="password"
              id="user-password1"
              placeholder="비밀번호를 다시 한 번 입력해주세요."
            />
            <button
              type="button"
              id="toggle-password1"
              onclick="togglePassword1()"
            >
              <img
                src="../img/비밀번호보기아이콘.png"
                alt="비밀번호보기아이콘"
              />
            </button>
          </div>
          <!-- 회원가입 버튼 -->
          <div class="create-account-box">
            <button class="create-account-btn">
              <a href="#" class="create-account-link">회원가입</a>
            </button>
          </div>
          <!-- 간편로그인 박스 -->
          <div class="simple-login-box">
            <div class="simple-login">
              <span>간편 로그인하기</span>
              <div class="icon-box">
                <a href="https://www.google.com/">
                  <img src="../img/구글.png" alt="구글" />
                </a>
                <a href="https://www.kakaocorp.com/page/">
                  <img src="../img/카카오.png" alt="카카오" />
                </a>
              </div>
            </div>
          </div>
          <!-- 나머지창 이미회원이신가요? 로그인 -->
          <div class="to-login">
            <span>이미 회원이신가요?</span>
            <a href="./login.html">로그인</a>
          </div>
        </div>
      </div>
      <!-- 메인프레임 >회원가입프레임 -->
    </section>
    <script>
      function togglePassword() {
        const x = document.getElementById("user-password");
        const toggleButton = document.getElementById("toggle-password");
        if (x.type === "password") {
          x.type = "text";
        } else {
          x.type = "password";
        }
      }
      function togglePassword1() {
        const y = document.getElementById("user-password1");
        const toggleButton = document.getElementById("toggle-password1");
        if (y.type === "password") {
          y.type = "text";
        } else {
          y.type = "password";
        }
      }
    </script>
  </body>
</html>
