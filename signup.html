<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 페이지</title>
    <link rel="stylesheet" href="signupstyle.css" />
  </head>
  <body>
    <div class="container">
      <a href="/">
        <img src="image/logo.png" alt="로고" class="logo" />
      </a>

      <div class="frame1">
        <div class="box1">
          <div class="input-box">
            <div class="email-box">
              <span class="email">이메일</span>
              <input
                type="text"
                class="email-inputbox"
                placeholder="이메일을 입력해주세요"
              />
            </div>
            <div class="email-box">
              <span class="email">닉네임</span>
              <input
                type="text"
                class="email-inputbox"
                placeholder="닉네임을 입력해주세요"
              />
            </div>
            <div class="password-box">
              <span class="password">비밀번호</span>
              <div class="password-inputbox-box">
                <input
                  type="text"
                  class="password-inputbox"
                  placeholder="비밀번호를 입력해주세요"
                />
                <img
                  class="password-img"
                  src="image/Property 1=Variant2.png"
                  alt="비밀번호표시"
                />
              </div>
            </div>
            <div class="password-box">
              <span class="password">비밀번호 확인</span>
              <div class="password-inputbox-box">
                <input
                  type="text"
                  class="password-inputbox"
                  placeholder="비밀번호를 다시 한 번 입력해주세요"
                />
                <img
                  class="password-img"
                  src="image/Property 1=Variant2.png"
                  alt="비밀번호표시"
                />
              </div>
            </div>
          </div>

          <div class="login-btn">로그인</div>
        </div>
        <div class="box2">
          <div class="social-login-box">
            <span class="social-login-text">간편 로그인하기</span>
            <div class="social-icon-box">
              <div class="social-icon1">
                <a href="https://www.google.com/">
                  <img src="image/Component 2.png" alt="구글" />
                </a>
              </div>
              <div class="social-icon2">
                <a href="https://www.kakaocorp.com/page/">
                  <img src="image/Component 3.png" alt="카카오" />
                </a>
              </div>
            </div>
          </div>
        </div>
        <div class="box3">
          <span class="box3-text1">이미 회원이신가요?</span>
          <a href="login.html">
            <span class="box3-text2">로그인</span>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
