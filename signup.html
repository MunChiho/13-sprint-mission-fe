<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./auth.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std-dynamic-subset.min.css"
    />
  </head>
  <body class="auth-page">
    <header>
      <div>
        <a class="brand-logo" href="/"
          ><img src="./판다 얼굴.svg" alt="logo" />
          <p class="brand-name">판다마켓</p></a
        >
      </div>
    </header>
    <main>
      <form action="">
        <section class="auth-form-container">
          <div class="form-group">
            <label for="email" class="form-label">이메일</label>
            <input
              id="email"
              class="form-input"
              placeholder="이메일을 입력해주세요"
              type="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="nickname" class="form-label">닉네임</label>
            <input
              id="nickname"
              class="form-input"
              placeholder="닉네임을 입력해주세요"
              type="text"
              required
            />
          </div>

          <div class="form-group">
            <label for="pwd" class="form-label">비밀번호</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="pwd"
                class="form-input"
                placeholder="비밀번호를 입력해주세요"
                required
              />
              <img src="./btn_visibility.png" alt="" />
            </div>
          </div>

          <div class="form-group">
            <label for="password-check" class="form-label">비밀번호 확인</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password-check"
                class="form-input"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
                required
              />
              <img src="./btn_visibility.png" alt="" />
            </div>
          </div>

          <button class="login-submit" type="submit">회원가입</button>

          <div class="social-login">
            <p>간편로그인 하기</p>
            <ul class="social-link">
              <li>
                <a href="https://www.google.com/"
                  ><img src="./구글.png" alt="구글"
                /></a>
              </li>
              <li>
                <a href="https://www.kakaocorp.com/page/"
                  ><img src="./카카오.png" alt="카카오"
                /></a>
              </li>
            </ul>
          </div>

          <p class="auth-helper-link">
            이미 회원이신가요? <a href="./login.html">로그인</a>
          </p>
        </section>
      </form>
    </main>
  </body>
</html>
