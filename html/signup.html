<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 회원가입</title>
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std.min.css"
    />
  </head>
 <body>
    <main class="login-page">
      <section class="signup-section">
        <section class="logo-area">
          <div>
          <a href="../index.html">
            <img src="../images/logo2.png" alt="판다마켓 로고2">
        </div></a>
        </section>
        <form class="auth-form">
          <div class="auth-input-area">
            <label for="email" class="auth-label">이메일</label>
            <input id="email" class="auth-input" type="email" placeholder="이메일을 입력주세요">
          </div>
          </form>
          <form class="auth-form">
          <div class="auth-input-area">
            <label for="nickname" class="auth-label">닉네임</label>
            <input id="nickname" class="auth-input" type="email" placeholder="닉네임을 입력주세요">
          </div>
          </form>
          <form class="auth-form">
          <div class="auth-input-area">
            <label for="password" class="auth-label">비밀번호</label>
            <div class="auth-input-wrapper">
            <input id="password" class="auth-input" type="password" placeholder="비밀번호를 입력해주세요">
            <button
              type="button" class="hide-btn" aria-label="비밀번호 보기" >
              <img src="../images/hide_btn.png" alt="숨기기 아이콘"/>
              </button>
            </div>
          </div></form>
          <form class="auth-form">
          <div class="auth-input-area">
            <label for="password" class="auth-label">비밀번호 확인</label>
            <div class="auth-input-wrapper">
            <input id="password" class="auth-input" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
            <button
              type="button" class="hide-btn" aria-label="비밀번호 보기" >
              <img src="../images/hide_btn.png" alt="숨기기 아이콘"/>
              </button>
            </div>
          </div></form>
          <button class="signup-btn"><a href="submit">회원가입</a></button>
          <section class="social-login">
            <p>간편 로그인하기</p>

            <div class="social-icons">
              <a href="https://www.google.com"><img src="../images/google.png" alt="구글 로그인" ></a>
              <a href="https://www.kakaocorp.com/page/"><img src="../images/kakao.png" alt="카카오 로그인" ></a>
            </div>
          </section>
          
          <section class="signup">
            <p>이미 회원이신가요?</p>
            <a class="signup-click">
              <a href="./login.html">로그인</a>
          </section>


    </main>
  </body>
</html>
