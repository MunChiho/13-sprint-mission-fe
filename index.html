<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./font.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard-std@1.3.9/dist/web/static/pretendard-std.min.css"
    />
    <title>판다마켓</title>
  </head>
  <body>
    <header class="header">
      <nav class="header-inner">
        <a href="/index.html" class="header-logo">
          <img src="./img/pandaface.png" class="pandaface" />
          <span class="pandamarket">판다마켓</span>
        </a>
        <a href="./login/login.html"><span class="header-btn">로그인</span></a>
      </nav>
    </header>
    <main>
      <section class="first">
        <div class="first-frame">
          <div class="first-inner">
            <span class="word">일상의 모든 물건을<br />거래해 보세요</span>
            <a class="first-btn" href="./move/items.html">
              <span class="look">구경하러 가기</span>
            </a>
          </div>
          <img src="./img/pandaimg.png" alt="판다이미지" class="pandaimg" />
        </div>
      </section>
      <section class="second">
        <div class="second-frame">
          <img src="./img/hotitemimg.png" alt="옷이미지" class="hotitemimg" />
          <div class="second-inner">
            <span class="word-blue">Hot item</span>
            <a class="word">인기 상품을<br />확인해 보세요</a>
            <a class="word-mini"
              >가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</a
            >
          </div>
        </div>
      </section>
      <section class="third">
        <div class="third-frame">
          <div class="third-inner">
            <span class="word-blue">Search</span>
            <a class="word">구매를 원하는<br />상품을 검색하세요</a>
            <a class="word-mini"
              >구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</a
            >
          </div>
          <img src="./img/searchimg.png" alt="검색이미지" class="searchimg" />
        </div>
      </section>
      <section class="fourth">
        <div class="fourth-frame">
          <img
            src="./img/registerimg.png"
            alt="레지스터이미지"
            class="registerimg"
          />
          <div class="fourth-inner">
            <span class="word-blue">Register</span>
            <span class="word">인기 상품을<br />확인해 보세요</span>
            <span class="word-mini"
              >가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</span
            >
          </div>
        </div>
      </section>
      <section class="fifth">
        <div class="fifth-frame">
          <div class="fifth-inner">
            <span class="word">믿을 수 있는<br />판다마켓 중고 거래</span>
          </div>
          <img src="./img/pandaimg2.png" class="pandaimg2" alt="판다이미지2" />
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-frame">
        <p class="footerwordgray">©codeit - 2024</p>
        <ul class="footer-inner-center">
          <li>
            <a class="footerwordwhite" href="./move/privacy.html">
              Privacy Policy
            </a>
          </li>
          <li>
            <a class="footerwordwhite" href="./move/FAQ.html"> FAQ </a>
          </li>
        </ul>
        <ul class="footer-inner-right">
          <li>
            <a href="http://www.facebook.com" target="_blank"
              ><img src="./img/ic_facebook.png" alt="페이스북이미지"
            /></a>
          </li>
          <li>
            <a href="http://www.twitter.com" target="_blank"
              ><img src="./img/ic_twitter.png" alt="트위터이미지"
            /></a>
          </li>
          <li>
            <a href="http://www.youtube.com" target="_blank"
              ><img src="./img/ic_youtube.png" alt="유튜브이미지"
            /></a>
          </li>
          <li>
            <a href="http://www.instagram.com/" target="_blank"
              ><img src="./img/ic_instagram.png" alt="인스타그램이미지"
            /></a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
