<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="icon" href="img/Panda_Face.svg" />
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/home.css">
</head>
<body>
  <header class="gnb">
    <div class="container flex-between">
      <a href="/" class="logo">
        <img src="./img/Panda_Face.svg" alt="로고">
        <span class="logo-text">판다마켓</span>
      </a>
      <a href="./pages/login.html" class="login-btn">로그인</a>
    </div>
  </header>

  <main>
    <section class="section-hero">
      <div class="hero-inner">
        <div class="hero-text-area">
          <h1>일상의 모든 물건을<br>거래해 보세요</h1>
          <a href="go_browsing.html" class="cta-btn">구경하러 가기</a>
        </div>
        <div class="hero-img-area">
          <img src="./img/Img_home_top.png" alt="히어로 이미지">
        </div>
      </div>
    </section>

    <section class="section-content white-bg">
      <div class="container flex-center">
        <div class="image-area">
          <img src="./img/Img_home_01.png" alt="인기 상품">
        </div>
        <div class="text-area">
          <p class="tagline">Hot item</p>
          <h2>인기 상품을<br>확인해 보세요</h2>
          <p class="description">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
        </div>
      </div>
    </section>

    <section class="section-content">
      <div class="container flex-center reverse">
        <div class="image-area">
          <img src="./img/Img_home_02.png" alt="검색 이미지">
        </div>
        <div class="text-area">
          <p class="tagline">Search</p>
          <h2>구매를 원하는<br>상품을 검색하세요</h2>
          <p class="description">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
        </div>
      </div>
    </section>

    <section class="section-content white-bg">
      <div class="container flex-center">
        <div class="image-area">
          <img src="./img/Img_home_03.png" alt="등록 이미지">
        </div>
        <div class="text-area">
          <p class="tagline">Register</p>
          <h2>판매를 원하는<br>상품을 등록하세요</h2>
          <p class="description">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
        </div>
      </div>
    </section>

    <section class="section-panda-banner">
      <div class="container banner-container">
        <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
        <div class="banner-img">
          <img src="./img/Img_home_bottom.png" alt="하단 이미지">
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container flex-between">
      <p class="copyright">©codeit - 2024</p>
      <nav class="footer-links">
        <a href="./pages/Privacy_Policy.html">Privacy Policy</a>
        <a href="./pages/FAQ.html">FAQ</a>
      </nav>
      <div class="sns-group">
        <a href="https://facebook.com" target="_blank"><img src="./img/ic_facebook.svg" alt="facebook"></a>
        <a href="https://twitter.com" target="_blank"><img src="./img/ic_twitter.svg" alt="twitter"></a>
        <a href="https://youtube.com" target="_blank"><img src="./img/ic_youtube.svg" alt="youtube"></a>
        <a href="https://instagram.com" target="_blank"><img src="./img/ic_instagram.svg" alt="instagram"></a>
      </div>
    </div>
  </footer>
  <script type="module" src="./JS/main.js"></script>
</body>
</html>
