<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std-dynamic-subset.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <a class="logo" href="/"
          ><img src="./판다 얼굴.svg" alt="logo" />
          <p class="logo-text">판다마켓</p></a
        >
        <a href="./login.html" class="login-btn">로그인</a>
      </div>
    </header>
    <main class="idnex-main">
      <section>
        <div class="hero">
          <div class="hero-text">
            <p class="hero-desc">일상의 모든 물건을 <br />거래해 보세요</p>
            <a href="./items.html" class="hero-look">구경하러가기</a>
          </div>
          <img src="./Img_home_top.png" alt="판다 이미지" />
        </div>
      </section>

      <section>
        <div class="main-card">
          <div class="card card-reverse">
            <div class="text-cardbox">
              <h2 class="card-title">hot item</h2>
              <div class="text-box">
                <p class="card-maintext">인기 상품을 <br />확인해 보세요</p>
                <p class="card-desc">
                  가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요
                </p>
              </div>
            </div>
            <img src="./Img_home_01.png" alt="옷 이미지" />
          </div>

          <div class="card">
            <div class="text-cardbox-e">
              <h2 class="card-title card-title-d">Search</h2>
              <div class="text-box">
                <p class="card-maintext card-text-d">
                  구매를 원하는 <br />상품을 검색하세요
                </p>
                <p class="card-desc card-desc-d">
                  구매하고 싶은 물품은 검색해서 <br />쉽게 찾아보세요
                </p>
              </div>
            </div>
            <img src="./Img_home_02.png" alt="돋보기 이미지" />
          </div>

          <div class="card card-reverse">
            <div class="text-cardbox">
              <h2 class="card-title">Register</h2>
              <div class="text-box">
                <p class="card-maintext">
                  판매를 원하는 <br />상품을 등록하세요
                </p>
                <p class="card-desc">
                  어떤 물건이든 판매하고 싶은 상품을 <br />쉽게 등록하세요
                </p>
              </div>
            </div>
            <img src="./Img_home_03.png" alt="옷 이미지" />
          </div>
        </div>
      </section>

      <section>
        <div class="main-bottom">
          <div class="hero-text">
            <p class="main-bottom-desc">믿을 수 있는<br />판다마켓 중고 거래</p>
          </div>
          <img src="./Img_home_bottom.png" alt="판다 이미지" />
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-inner">
        <p class="footer-left">©codeit - 2024</p>
        <div class="footer-center">
          <a href="./privacy.html">Privacy Policy</a>
          <a href="./faq.html">FAQ</a>
        </div>
        <div class="footer-right">
          <a href="https://www.facebook.com" target="_blank">
            <img src="./ic_facebook.png" />
          </a>

          <a href="https://x.com/home" target="_blank"
            ><img src="./ic_twitter.png" />
          </a>

          <a href="https://www.youtube.com/" target="_blank"
            ><img src="./ic_youtube.png" />
          </a>

          <a href="https://www.instagram.com/" target="_blank"
            ><img src="./ic_instagram.png" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
