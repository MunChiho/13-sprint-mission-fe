<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header class="gnb">
      <div class="gnb-inner">
        <a href="./">
          <img
            class="gnb-logo"
            src="./assets/logo/logo-panda-market.svg"
            alt="판다마켓"
        /></a>
        <a href="./pages/login.html" class="gnb-login text-lg-semibold"
          >로그인
        </a>
      </div>
    </header>

    <main class="main">
      <div class="banner">
        <section class="banner-inner">
          <div class="banner-txt">
            <h1 class="banner-title">일상의 모든 물건을<br />거래해 보세요</h1>
            <a href="./pages/items.html" class="banner-btn text-xl-semibold"
              >구경하러 가기
            </a>
          </div>
          <img
            class="banner-img"
            src="./assets/img/Img-home-top.svg"
            alt="배너이미지"
          />
        </section>
      </div>
      <div class="card-container">
        <section class="card-section">
          <div class="card-inner">
            <img
              class="card-img"
              src="./assets/img/Img-home-01.svg"
              alt="home01이미지"
            />
            <div class="card-contents">
              <p class="card-subtitle text-2lg-bold">Hot item</p>
              <div class="card-txt">
                <h2 class="card-title">인기 상품을<br />확인해 보세요</h2>
                <h3 class="card-desc text-2xl-medium">
                  가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
                </h3>
              </div>
            </div>
          </div>
        </section>
        <section class="card-section">
          <div class="card-inner">
            <div class="card-contents-reverse">
              <p class="card-subtitle text-2lg-bold">Search</p>
              <div class="card-txt">
                <h2 class="card-title">구매를 원하는<br />상품을 검색하세요</h2>
                <h3 class="card-desc text-2xl-medium">
                  구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
                </h3>
              </div>
            </div>
            <img
              class="card-img"
              src="./assets/img/Img-home-02.svg"
              alt="home02이미지"
            />
          </div>
        </section>
        <section class="card-section">
          <div class="card-inner">
            <img
              class="card-img"
              src="./assets/img/Img-home-03.svg"
              alt="home03이미지"
            />
            <div class="card-contents">
              <p class="card-subtitle text-2lg-bold">Register</p>
              <div class="card-txt">
                <h2 class="card-title">판매를 원하는<br />상품을 등록하세요</h2>
                <h3 class="card-desc text-2xl-medium">
                  어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
                </h3>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="banner">
        <section class="banner-inner">
          <div class="banner-txt">
            <p class="banner-title">믿을 수 있는<br />판다마켓 중고 거래</p>
          </div>
          <img
            class="banner-img"
            src="./assets/img/Img-home-bottom.svg"
            alt="배너이미지"
          />
        </section>
      </div>
    </main>

    <footer class="footer">
      <span class="footer-copyright">©codeit - 2024</span>
      <nav class="footer-nav">
        <a class="footer-nav-link" href="./pages/privacy.html"
          >Privacy Policy</a
        >
        <a class="footer-nav-link" href="./pages/faq.html">FAQ</a>
      </nav>
      <div class="footer-social">
        <a
          class="footer-social-link"
          href="https://facebook.com"
          target="_blank"
          ><img src="./assets/icon/ic-facebook.svg" alt="facebook"
        /></a>
        <a class="footer-social-link" href="https://x.com" target="_blank"
          ><img src="./assets/icon/ic-twitter.svg" alt="twitter"
        /></a>
        <a class="footer-social-link" href="https://youtube.com" target="_blank"
          ><img src="./assets/icon/ic-youtube.svg" alt="youtube"
        /></a>
        <a
          class="footer-social-link"
          href="https://instagram.com"
          target="_blank"
          ><img src="./assets/icon/ic-instagram.svg" alt="instagram"
        /></a>
      </div>
    </footer>
  </body>
</html>
